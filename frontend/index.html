<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080B14" />
    <meta
      name="description"
      content="Fathy Nassef Sender Suite — a modern WhatsApp bulk messaging platform for text, media, and spreadsheet-driven campaigns."
    />

    <title>Fathy Nassef · Sender Suite</title>

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2310B981'/%3E%3Cstop offset='1' stop-color='%2306B6D4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M26.2 6.1 6.4 13.3c-.9.3-.9 1.6 0 1.9l6.1 2.1 2.1 6.1c.3.9 1.6.9 1.9 0l7.2-19.8c.3-.8-.5-1.5-1.3-1.2z' fill='%2304140E' fill-opacity='.9'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Paint the dark base before React mounts to avoid a white flash. */
      html,
      body {
        margin: 0;
        background: #080b14;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }

      #boot i {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #10b981;
        animation: boot-spin 0.8s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
